name: ATLAS development checks
on:
  push:
  pull_request:
jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify model links, core, companion and native tests
        run: python scripts/check_project.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify extension worker authority contract
        run: |
          node scripts/test_extension_broker.mjs
          node scripts/test_bookmarks.mjs
          node scripts/test_pages.mjs
          node scripts/test_image_file.mjs
          node scripts/test_pinboard_card_hold.mjs
          node scripts/test_pinboard_preview_connections.mjs
          node scripts/test_pinboard_preview_sections.mjs
          node scripts/test_pinboard_menu.mjs
          node scripts/test_pinboard_appearance.mjs
          node scripts/test_pinboard_blank.mjs
          node scripts/test_image_entries.mjs
          node scripts/test_image_recovery.mjs
          node scripts/test_workspace.mjs
          node scripts/test_workspace_ui.mjs
          node scripts/test_workspace_preview.mjs
          node scripts/test_workspace_windows.mjs
          node scripts/test_explorer_entry_point.mjs
          node scripts/test_pinboard_rename.mjs
          node scripts/test_source_navigation.mjs
          node scripts/test_pinboard.mjs
          node scripts/test_pinboard_generation.mjs
          node scripts/test_pinboard_tag_editor.mjs
      - name: Verify extension packaging and bundled notices
        run: python scripts/package_extension.py
      - name: Verify real CLI and filesystem integration
        run: python scripts/smoke_companion.py
      - name: Verify native wake and worker integration without replay
        run: node scripts/test_recovery_broker_native.mjs

  workspace-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/atlas-browser" playwright@1.62.1
          "$RUNNER_TEMP/atlas-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify actual rendered pointer and content interactions
        run: |
          export ATLAS_PLAYWRIGHT_MODULE="$RUNNER_TEMP/atlas-browser/node_modules/playwright/index.mjs"
          export ATLAS_WORKSPACE_EVIDENCE="$RUNNER_TEMP/workspace-evidence"
          export ATLAS_WINDOW_EVIDENCE="$RUNNER_TEMP/workspace-evidence/windows"
          node scripts/test_workspace_browser.mjs
          node scripts/test_workspace_window_browser.mjs
      - name: Verify actual MV3 Shelf launcher, bookmarks and storage
        run: |
          export ATLAS_PLAYWRIGHT_MODULE="$RUNNER_TEMP/atlas-browser/node_modules/playwright/index.mjs"
          export ATLAS_REQUIRE_MV3=1
          node scripts/test_workspace_mv3.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-browser-evidence
          path: ${{ runner.temp }}/workspace-evidence
