name: ATLAS foundation checks
on:
  push:
  pull_request:
jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify model links and prototype domain tests
        run: python scripts/check_project.py
