name: Build Windows companion
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/atlas_companion/**'
      - 'src/atlas_native/**'
      - 'src/atlas_core/**'
      - 'scripts/build_windows_companion.py'
      - 'scripts/prepare_tagging_models.py'
      - 'scripts/smoke_windows_companion.py'
      - 'scripts/smoke_windows_launch.py'
      - 'tests/test_windows_*.py'
      - 'packaging/**'
      - 'extension/**'
      - '.github/workflows/windows-companion.yml'
permissions:
  contents: read
jobs:
  standalone:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned build tools
        run: python -m pip install -r packaging/requirements-build.txt
      - name: Verify real Windows installation and filesystem boundaries
        shell: pwsh
        run: |
          $env:PYTHONPATH = 'src'
          python -m unittest discover -s tests -p 'test_windows_*.py' -v
          exit $LASTEXITCODE
      - name: Build standalone Windows executable
        run: python scripts/build_windows_companion.py
      - name: Execute separate ONNX jobs without importing AI into the core
        run: dist/windows/atlas-companion.exe --tagging-smoke
      - name: Verify actual Windows native management widgets
        run: python scripts/smoke_desktop.py
      - name: Verify duplicate setup launches stay light
        run: python scripts/smoke_windows_launch.py dist/windows/atlas-companion.exe
      - name: Verify actual frozen native frames and HTTP bytes
        run: python scripts/smoke_windows_companion.py dist/windows/atlas-companion.exe
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-companion-windows-x86_64
          path: |
            dist/windows/atlas-companion.exe
            dist/windows/debug.exe
            dist/windows/tagging-engine/
            dist/windows/tagging-models/
            dist/windows/BUILD_RECEIPT.json
            dist/windows/SHA256SUMS
            dist/windows/README.md
            dist/windows/TAGGING_MODEL_NOTICES.md
            dist/windows/model-licenses/
            dist/windows/atlas-extension-*.zip
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-companion-core-windows-x86_64
          path: |
            dist/windows/atlas-companion.exe
            dist/windows/debug.exe
            dist/windows/BUILD_RECEIPT.json
            dist/windows/SHA256SUMS
            dist/windows/README.md
            dist/windows/atlas-extension-*.zip
          if-no-files-found: error
          retention-days: 14
