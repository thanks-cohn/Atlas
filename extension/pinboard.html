<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pinboard · Atlas</title><link rel="stylesheet" href="pinboard.css"></head><body>
<header><div class="wordmark">ATLAS <span>/ PINBOARD</span></div><button id="refresh">Refresh</button></header>
<main><section class="intro"><p class="eyebrow">YOUR BOOKMARKS, IN VIEW</p><h1 id="title">Your pinboard.</h1><p>Explore the image. Follow the source. Make it yours.</p></section>
<div class="tools"><label>Collection<select id="folder"><option value="all">All bookmarks</option></select></label><label class="search">Find a bookmark<input id="search" type="search" placeholder="Search titles and URLs…"></label></div>
<p id="status" role="status">Loading bookmarks…</p><div id="pins" aria-label="Bookmark pinboard"></div><div id="sentinel" aria-hidden="true"></div>
<nav class="paging" aria-label="Pinboard browsing"><button id="previous">← Previous set</button><button id="more">Show more</button><button id="next">Next set →</button></nav><p class="storage-note">A live view of your Chrome bookmarks. Uploaded bookmark covers and saved pinboard settings currently live in this Chrome profile.</p></main>
<dialog id="detail" aria-label="Bookmark preview"><button id="close">Back to board ×</button><img id="detail-image" alt=""><div class="detail-copy"><h2 id="detail-title"></h2><p id="detail-note"></p><div id="detail-tags"></div><a id="detail-link" target="_blank" rel="noopener noreferrer">Visit source ↗</a><button id="replace-image">Change image</button></div></dialog>
<input id="image-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
<script type="module" src="pinboard.js"></script></body></html>
