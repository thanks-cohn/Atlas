<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Atlas Workspace</title>
    <link rel="stylesheet" href="workspace.css" />
  </head>
  <body>
    <aside>
      <a class="brand" href="workspace.html"
        >A <span>ATLAS<small>Your workspace</small></span></a
      >
      <nav id="navigation" aria-label="Workspace sections"></nav>
      <div class="legacy">
        <a href="pinboard.html">▦ Pinboard</a
        ><a href="page.html">▧ Story Gallery</a
        ><a href="explorer.html">↗ Explorer & settings</a>
      </div>
      <small>Local first. Yours always.</small>
    </aside>
    <main>
      <div id="workspace-chrome" class="workspace-chrome">
        <header>
          <div>
            <small>EVERYTHING IN ITS PLACE</small>
            <h1>Workspace</h1>
          </div>
          <div class="actions">
            <button id="dual" aria-pressed="false">Dual Pane</button
            ><button id="restore">Restore layout</button
            ><button id="activity">Activity & recovery</button>
          </div>
        </header>
        <p id="notice" role="status">
          Browse and compare your Atlas resources.
        </p>
        <div class="layout-controls">
          <span class="resize-hint">Drag panel edges to resize</span>
          <button data-expand="top">Expand hierarchies</button
          ><button data-expand="bottom">Expand viewers</button>
        </div>
      </div>
      <section id="panes" aria-label="Resource explorers"></section>
    </main>
    <script type="module" src="workspace.js"></script>
    <script type="module" src="activity.js"></script>
  </body>
</html>
